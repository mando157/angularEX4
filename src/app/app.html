<div class="products">
    <div class="container">
        <div class="row justify-content-center align-items-center rounded-3 m-2">

            @for (image of images; track $index) {
            <div class="box">
                <img [src]="image.src" [attr.data-index]="$index" #selectedImage alt="car">
                <div class="content">
                    <div class="plus" (click)="openPopup(popup , popupEle, selectedImage ,popupImage)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="25px" height="25px" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2">
                                <path stroke-dasharray="60" stroke-dashoffset="60"
                                    d="M3 12c0 -4.97 4.03 -9 9 -9c4.97 0 9 4.03 9 9c0 4.97 -4.03 9 -9 9c-4.97 0 -9 -4.03 -9 -9Z">
                                    <animate attributeName="stroke-dashoffset" dur="3s" repeatCount="indefinite"
                                        keyTimes="0;0.2;0.8;0.9;1" values="60;0;0;60;60" />
                                </path>
                                <g stroke-dasharray="12" stroke-dashoffset="12">
                                    <path d="M7 12h10">
                                        <animate attributeName="stroke-dashoffset" dur="3s" repeatCount="indefinite"
                                            keyTimes="0;0.2;0.267;0.8;0.833;1" values="12;12;0;0;12;12" />
                                    </path>
                                    <path d="M12 7v10">
                                        <animate attributeName="stroke-dashoffset" dur="3s" repeatCount="indefinite"
                                            keyTimes="0;0.267;0.333;0.8;0.833;1" values="12;12;0;0;12;12" />
                                    </path>
                                </g>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</div>

<div class="popup" #popup (click)="closePopup(popup , $event)">
    <div class="popup-element" #popupEle (click)="$event.stopPropagation()">

        <img src="assets/images/car_1.png" #popupImage alt="car">

        <div class="cancel" (click)="closePopup(popup , $event)">
            <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" width="30px" height="30px" viewBox="0 0 24 24">
                <path d="M0 0h24v24H0z" fill="none" />

                <g transform="translate(12 12)">
                    <g opacity="0">
                        <animateTransform attributeName="transform" type="scale" dur="0.4s" fill="freeze"
                            calcMode="spline" keyTimes="0;0.6;1" keySplines="0.3 0 0.2 1;0.4 0 0.6 1"
                            values="0.5;1.08;1" />
                        <animate attributeName="opacity" dur="0.25s" fill="freeze" values="0;1" />
                        <g transform="translate(-12 -12)">
                            <path fill="#fff" fill-rule="evenodd"
                                d="M7.317 3.769a42.5 42.5 0 0 1 9.366 0c1.827.204 3.302 1.643 3.516 3.48c.37 3.157.37 6.346 0 9.503c-.215 1.837-1.69 3.275-3.516 3.48a42.5 42.5 0 0 1-9.366 0c-1.827-.205-3.302-1.643-3.516-3.48a41 41 0 0 1 0-9.503c.214-1.837 1.69-3.276 3.516-3.48m9.2 1.49a41 41 0 0 0-9.034 0A2.486 2.486 0 0 0 5.29 7.424a39.4 39.4 0 0 0 0 9.154a2.486 2.486 0 0 0 2.193 2.164c2.977.332 6.057.332 9.034 0a2.486 2.486 0 0 0 2.192-2.164a39.4 39.4 0 0 0 0-9.154a2.486 2.486 0 0 0-2.192-2.163"
                                clip-rule="evenodd" />
                        </g>
                    </g>
                </g>

                <g class="x" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round">
                    <path d="M9 9L15 15" stroke-dasharray="8.5" stroke-dashoffset="8.5">
                        <animate attributeName="stroke-dashoffset" begin="0.25s" dur="0.25s" fill="freeze"
                            values="8.5;0" />
                    </path>
                    <path d="M9 15L15 9" stroke-dasharray="8.5" stroke-dashoffset="8.5">
                        <animate attributeName="stroke-dashoffset" begin="0.4s" dur="0.25s" fill="freeze"
                            values="8.5;0" />
                    </path>
                </g>
            </svg>
        </div>

        <div class="next" (click)="next(popupImage)">
            <svg xmlns="http://www.w3.org/2000/svg" width="30px" height="30px" viewBox="0 0 24 24">
                <path d="M0 0h24v24H0z" fill="none" />
                <g transform="rotate(90 12 12)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="1.5">
                    <g>
                        <animateTransform attributeName="transform" type="translate" dur="1.5s" repeatCount="indefinite"
                            values="0 3;0 0;0 -3" keyTimes="0;0.5;1" />
                        <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="0;1;0"
                            keyTimes="0;0.5;1" />
                        <path d="m5.56 8.25l3.6-3.61c1.34-1.34 2-2 2.83-2s1.5.66 2.83 2l3.63 3.61M12 16.08V2.8" />
                    </g>
                    <path fill="#fff" d="M12.62 20.8a.62.62 0 1 1-1.24 0a.62.62 0 0 1 1.24 0">
                        <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="1;0.3;1"
                            keyTimes="0;0.5;1" />
                    </path>
                </g>
            </svg>
        </div>

        <div class="prev" (click)="prev(popupImage)">
            <svg xmlns="http://www.w3.org/2000/svg" width="30px" height="30px" viewBox="0 0 24 24">
                <path d="M0 0h24v24H0z" fill="none" />
                <g transform="rotate(-90 12 12)" fill="none" stroke="#fff" stroke-linecap="round"
                    stroke-linejoin="round" stroke-width="1.5">
                    <g>
                        <animateTransform attributeName="transform" type="translate" dur="1.5s" repeatCount="indefinite"
                            values="0 3;0 0;0 -3" keyTimes="0;0.5;1" />
                        <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="0;1;0"
                            keyTimes="0;0.5;1" />
                        <path d="m5.56 8.25l3.6-3.61c1.34-1.34 2-2 2.83-2s1.5.66 2.83 2l3.63 3.61M12 16.08V2.8" />
                    </g>
                    <path fill="#fff" d="M12.62 20.8a.62.62 0 1 1-1.24 0a.62.62 0 0 1 1.24 0">
                        <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="1;0.3;1"
                            keyTimes="0;0.5;1" />
                    </path>
                </g>
            </svg>
        </div>

        <ul class="m-0 p-0 list-unstyled">
            <ng-container *ngFor="let image of images , index as i">
                <li class="{{(currentImageIndex == i) ? 'active' : ''}}" (click)="changeActive(i)">{{i + 1}}</li>
            </ng-container>
        </ul>

    </div>
</div>
